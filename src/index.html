<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                background-color: rgb(0, 0, 0);
                margin: 0;
            }

            #webgl {
                pointer-events: none;
            }

            #ui-app {
                width: 100%;
                height: 100%;
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
            }

            #ui {
                position: absolute;
                overflow: hidden;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 3;
                display: flex;
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
            }

            #monitor-videos {
                pointer-events: none;
                position: absolute;
                opacity: 0;
                width: 0;
                height: 0;
                top: 0;
                left: 0;
            }

            #css {
                cursor: pointer;
            }

            #ui-interactive {
                position: absolute;
                top: 0;
                left: 0;
                width: 256px;
                z-index: 2;
            }

            video {
                position: absolute;
                top: 0;
                pointer-events: none;
            }
        </style>

        <!-- Primary Meta Tags -->
        <title>Manikant Mishra - CSE Student &amp; Developer</title>
        <meta
            name="title"
            content="Manikant Mishra - CSE Student &amp; Developer"
        />
        <meta
            name="description"
            content="Manikant Mishra is a Computer Science student at GLA University, Mathura, focused on full-stack web development and competitive programming."
        />
        <meta
            name="keywords"
            content="Manikant Mishra, portfolio, MERN stack, web developer, GLA University, competitive programming"
        />
        <meta name="author" content="Manikant Mishra" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://github.com/Manikant0931" />
        <meta
            property="og:title"
            content="Manikant Mishra - CSE Student &amp; Developer"
        />
        <meta
            property="og:description"
            content="Computer Science student at GLA University, Mathura, building full-stack web applications and sharpening problem-solving skills."
        />

        <!-- Twitter -->

        <meta property="twitter:card" content="summary_large_image" />
        <meta name="twitter:card" content="summary_large_image" />

        <meta
            property="twitter:url"
            content="https://github.com/Manikant0931"
        />
        <meta name="twitter:url" content="https://github.com/Manikant0931" />

        <meta
            property="twitter:title"
            content="Manikant Mishra - CSE Student &amp; Developer"
        />
        <meta
            name="twitter:title"
            content="Manikant Mishra - CSE Student &amp; Developer"
        />

        <meta
            property="twitter:description"
            content="Computer Science student at GLA University, Mathura, building full-stack web applications and sharpening problem-solving skills."
        />
        <meta
            name="twitter:description"
            content="Computer Science student at GLA University, Mathura, building full-stack web applications and sharpening problem-solving skills."
        />

        <meta property="twitter:image" content="../static/images/preview.jpg" />
        <meta name="twitter:image" content="../static/images/preview.jpg" />

        <!-- Images -->
        <meta property="og:image" content="../static/images/preview.jpg" />
        <meta
            property="og:image:secure"
            content="../static/images/preview.jpg"
        />

        <link
            rel="shortcut icon"
            href="../static/images/favicon.ico"
            type="image/x-icon"
        />
    </head>

    <body>
        <div id="css"></div>
        <div id="webgl"></div>
        <div id="overlay"></div>
        <div id="ui-interactive"></div>
        <div id="ui"></div>
        <div id="monitor-videos">
            <video
                id="video-1"
                muted
                loop
                autoplay
                width="0"
                height="0"
                src="../static/textures/monitor/video/base-static.mp4"
                style="opacity: 0"
            ></video>
            <video
                id="video-2"
                muted
                loop
                autoplay
                width="0"
                height="0"
                src="../static/textures/monitor/video/static-texture-layer.mp4"
                style="opacity: 0"
            ></video>
        </div>
    </body>
</html>
